<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.home %}
  <title>七一 · 游戏策划 | {{ site.title | escape }}</title>
  {% else %}
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  {% endif %}
  <meta name="description" content="{{ page.description | default: '七一的个人站，设有摄影、绘图、视频、项目和文章归档。' | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <script src="{{ '/assets/portfolio/theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/portfolio/site.css' | relative_url }}?v=chic">
</head>
<body{% if page.home %} class="home"{% endif %}>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}"{% if page.home %} aria-current="page"{% endif %}>{{ site.title | escape }}</a>
    <nav class="navigation" aria-label="主导航">
      <a href="{{ '/photography/' | relative_url }}"{% if page.section == 'photography' %} aria-current="page"{% endif %}>摄影</a>
      <a href="{{ '/drawing/' | relative_url }}"{% if page.section == 'drawing' %} aria-current="page"{% endif %}>绘图</a>
      <a href="{{ '/videos/' | relative_url }}"{% if page.section == 'videos' %} aria-current="page"{% endif %}>视频</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.section == 'projects' %} aria-current="{% if page.url == '/projects/' %}page{% else %}location{% endif %}"{% endif %}>项目</a>
      <a href="{{ '/archives/' | relative_url }}"{% if page.section == 'archives' %} aria-current="page"{% endif %}>文章</a>
      <a href="{{ '/about-me/' | relative_url }}"{% if page.section == 'about' %} aria-current="page"{% endif %}>关于</a>
    </nav>
    <button class="theme-switch" type="button" role="switch" aria-label="深色模式" aria-checked="false" title="切换黑／白主题" hidden>
      <span class="theme-track" aria-hidden="true"></span>
    </button>
  </header>
  {{ content }}
</body>
</html>
